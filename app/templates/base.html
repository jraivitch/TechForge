<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TechForge{% endblock %}</title>

  <!-- Anti-flash: apply the saved theme BEFORE the page paints, so there's
       no flicker from light → dark on load. Runs inline in <head> on purpose. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* localStorage unavailable — fall back to light */ }
    })();
  </script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body>

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="sidebar">

    <div class="sidebar-brand">
      <a href="{{ url_for('dashboard.index') }}" class="brand-link">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">TechForge</span>
      </a>
    </div>

    <div class="sidebar-search">
      <form action="{{ url_for('search.search') }}" method="GET">
        <div class="search-wrap">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/>
          </svg>
          <input
            type="text"
            name="q"
            placeholder="Search..."
            value="{{ request.args.get('q', '') }}"
            autocomplete="off"
          />
        </div>
      </form>
    </div>

    <nav class="sidebar-nav">
      <a href="{{ url_for('dashboard.index') }}"
         class="nav-item {% if request.endpoint == 'dashboard.index' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
        </svg>
        Dashboard
      </a>
      <a href="{{ url_for('topics.index') }}"
         class="nav-item {% if request.endpoint == 'topics.index' %}active{% endif %}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/>
        </svg>
        All Topics
      </a>
    </nav>

    <div class="sidebar-section-label">Topics</div>

    <nav class="sidebar-topics">
      {% for t in sidebar_topics %}
      <a href="{{ url_for('topics.detail', topic_id=t['id']) }}"
         class="topic-item {% if current_topic_id == t['id'] %}active{% endif %}">
        <span class="topic-icon">{{ t['icon'] }}</span>
        <span class="topic-name">{{ t['name'] }}</span>
      </a>
      {% endfor %}
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path d="M7.455 2.004a.75.75 0 01.26.77 7 7 0 009.958 7.967.75.75 0 011.067.853A8.5 8.5 0 116.647 1.921a.75.75 0 01.808.083z"/>
        </svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 2a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 2zM10 15a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 15zM4.464 4.464a.75.75 0 011.06 0l1.061 1.06a.75.75 0 01-1.06 1.061l-1.06-1.06a.75.75 0 010-1.061zM13.414 13.414a.75.75 0 011.061 0l1.06 1.06a.75.75 0 11-1.06 1.061l-1.06-1.06a.75.75 0 010-1.061zM2 10a.75.75 0 01.75-.75h1.5a.75.75 0 010 1.5h-1.5A.75.75 0 012 10zM15 10a.75.75 0 01.75-.75h1.5a.75.75 0 010 1.5h-1.5A.75.75 0 0115 10zM4.464 15.536a.75.75 0 010-1.061l1.06-1.06a.75.75 0 011.061 1.06l-1.06 1.06a.75.75 0 01-1.061 0zM13.414 6.586a.75.75 0 010-1.061l1.06-1.06a.75.75 0 111.061 1.06l-1.06 1.06a.75.75 0 01-1.061 0zM10 6a4 4 0 100 8 4 4 0 000-8z" clip-rule="evenodd"/>
        </svg>
        <span class="label-dark">Dark mode</span>
        <span class="label-light">Light mode</span>
      </button>
    </div>

  </aside>
  <!-- ── End Sidebar ───────────────────────────────────────── -->

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
